render:
  dpi: 150
retriever:
  model_id: "vidore/colqwen2-v1.0"     # VERIFY on Hub at Phase 2 (Option A); fallback to a ColPali ckpt if unavailable
  device: "cuda"
  dtype: "bfloat16"
  prefetch_k_multiplier: 4
  top_k: 3
  pooling: "row_col_mean"
  query_encoder: "colqwen"   # rec 5: real ColQwen text encoder; "fake" for CPU tests
  retrieval_mode: "hybrid"   # Run 9: keyword | visual | hybrid (default hybrid)
  rrf_k: 60                  # reciprocal rank fusion constant
  query_vectors_dir: "data/query_cache"   # precomputed query vectors (Colab/laptop GPU)
  online_encoder: true       # Run 9: encode cache misses online (text-side ColQwen)
  online_encoder_device: "cuda"
  rerank: true               # Run 9: deterministic reranker over the top candidates
  rerank_top_k: 5            # pages shown to the reader
  bridge_resolution: true    # Run 9: resolve "the company that ..." bridge clauses
qdrant:
  mode: "local"
  path: "data/index/qdrant"   # inside the export dir so index.zip is self-contained
  collection_full: "pages_full"
  collection_pooled: "pages_pooled"
reader:
  provider: "gemini"
  model: "gemini-3.5-flash"             # verified live 2026-10-15 (2.5-flash retired); never hardcode in code
  n_samples: 3
  temperature: 0.7
  max_output_tokens: 512
  max_claims: 5
  fallback_provider: ""                 # rec 9: e.g. "groq"; leave empty to disable
  fallback_model: ""                    # e.g. "llama-3.3-70b-versatile"
  retry_on_unanswerable: false          # Run 9: reader always answers; no passage retry
  unanswerable_retry_overlap: 0.2       # min question/passage keyword overlap to bother retrying
  max_answer_retries: 1
  max_pages: 3                          # Phase 2: pages in the reader prompt (primary has images)
  next_page_retry: true                 # Phase 2: promote next page once if still UNANSWERABLE
verify:
  quote_threshold: 0.8                  # rec 4: fuzzy quote-match pass threshold (deterministic)
  ocr_normalize: true                   # rec 7: tolerate OCR whitespace/case noise in quotes
  require_answer_support: false         # Run 9: support is reported, never a veto
  support_entail_threshold: 0.5
  answer_type_check: false              # Run 9 (s4.1): removed from the gate
  comparison_check: "warn"              # Run 9: "off" | "warn" | "block"
  question_detail_check: "warn"         # Run 9 (s4.4): years/dates/units/entities
  mode: "examiner_shown"                # Run 9 (s4.3): examiner sees the claim on every answer
  examiner_provider: "groq"
  examiner_models:                      # largest-first; probed at startup
    - "qwen/qwen3.8-27b"
    - "meta-llama/llama-4-maverick-17b-128e-instruct"
    - "meta-llama/llama-4-scout-17b-16e-instruct"
  examiner_max_tokens: 700
  examiner_temperature: 0.0
  examiner_quote_threshold: 0.6
  examiner_on_every_answer: true
  independence_required: true
  log_served_by: true
  visual_tier: "cross_family"           # legacy: superseded by the examiner
  visual_min_agreement: 0.66
  cross_family_provider: "groq"
  cross_family_model: "qwen/qwen3.8-27b"
nli:
  model_id: "cross-encoder/nli-deberta-v3-base"
  device: "auto"   # auto = cuda when available, else cpu
ground:
  heat_threshold_rel: 0.5
  min_box_area_frac: 0.002
  max_boxes: 3
  box_padding_px: 8
  heatmap_as_prior_only: true   # rec 5: heatmap picks region, final box always snapped to words
  smooth_sigma: 0.0
gate:
  mode: "conformal"
  alpha: 0.10
  delta: 0.10
  fixed_tau: 0.5
  scorer_path: "data/gate/scorer.pkl"   # rec 5: produced by scripts/calibrate_gate.py
  tau_path: "data/gate/tau.json"
ratelimit:
  requests_per_minute: 10
  max_retries: 6
eval:
  dataset: "slidevqa"
  n_debug: 45
  seed: 42
  calib_frac: 0.5
run:                                    # live test-run harnesses (no longer hardcoded in scripts)
  live_call_gap_s: 25.0                 # pacing between live reader calls
  model_candidates: ["gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.1-flash-lite", "gemini-3.7-flash"]
  reader_model_pinned: ""               # pin ONE model for the whole run ("" = config model)
  allow_model_rotation: false           # Run 9 (s4.8): no silent switching; wait instead
  reader_max_wait_s: 900.0
output:                                 # Run 9 (s5): the three-state contract
  always_show_answer: true
  low_confidence_suffix: "(not confident enough)"
  always_show_source: true
  nothing_found_text: "Nothing found in this document."
  verified_label: "Verified"
  not_confident_label: "Not confident enough"
  nothing_found_label: "Nothing found"
ingest:
  table_cells: true                     # Run 9 (s4.5): cells become citation units
  vlm_transcribe_empty: false           # opt-in: VLM-transcribe pages with no OCR
cache_dir: "data/cache"
