[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vvrag"
version = "0.1.0"
description = "Verifiable Visual RAG (cheaper/faster variant with conformal abstention gate)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "python-dotenv>=1",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pillow>=10",
  "pymupdf>=1.23",
  "pytesseract>=0.3",
  "qdrant-client>=1.9",
  "torch>=2.2",
  "transformers>=4.40",
  "colpali-engine>=0.3",
  "google-generativeai>=0.5",
  "groq>=0.9",
  "openai>=1.30",
  "sentence-transformers>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
